apiVersion: apps/v1
kind: Deployment
metadata:
  name: changedetection
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: changedetection
    app.kubernetes.io/component: application
    app.kubernetes.io/managed-by: kube.changedetection
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: changedetection
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: changedetection
        app.kubernetes.io/component: application
        app.kubernetes.io/managed-by: kube.changedetection
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: changedetection
          image: docker.io/dgtlmoon/changedetection.io:0.60.10@sha256:72f97681f390e4d6ae3e6585e1e0036449910f347144b766fc23910458566a1a
          imagePullPolicy: IfNotPresent
          env:
            - name: BASE_URL
              value: https://__FQDN__
            - name: PLAYWRIGHT_DRIVER_URL
              value: ws://sockpuppet:3000/?--window-size=1920,1080
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /datastore
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: changedetection-data
