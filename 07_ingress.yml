apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: changedetection
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: changedetection
    app.kubernetes.io/managed-by: kube.changedetection
spec:
  ingressClassName: traefik
  rules:
    - host: __FQDN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: changedetection
                port:
                  name: http
