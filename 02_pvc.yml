apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: changedetection-data
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: changedetection
    app.kubernetes.io/managed-by: kube.changedetection
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
